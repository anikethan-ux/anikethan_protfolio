<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portfolio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
  :root{
    --bg:#0A0C10;
    --bg-elevated:#12151C;
    --border:rgba(255,255,255,0.09);
    --border-soft:rgba(255,255,255,0.05);
    --text:#DCE1E8;
    --text-dim:#7C8798;
    --text-faint:#4B5563;
    --accent:#39FF88;
    --accent-dim:rgba(57,255,136,0.12);
    --accent-ink:#0A0C10;
    --amber:#FFB454;
    --amber-dim:rgba(255,180,84,0.12);
    --circuit:#3B82F6;
    --circuit-dim:rgba(59,130,246,0.14);
    --danger:#ff6b6b;
    --mono:'JetBrains Mono', ui-monospace, monospace;
    --display:'Space Grotesk', sans-serif;
    --body:'Inter', sans-serif;
    --maxw:920px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--body);
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }

  /* ===== Neural network background (full page) ===== */
  #neural-bg{
    position:fixed; inset:0; z-index:0; width:100%; height:100%;
    display:block; pointer-events:none;
  }
  body::after{
    content:"";
    position:fixed; top:-10%; left:50%; transform:translateX(-50%);
    width:900px; height:600px; max-width:140vw;
    background:radial-gradient(ellipse at center, rgba(59,130,246,0.10), transparent 70%);
    pointer-events:none;
    z-index:0;
    filter:blur(10px);
  }

  a{color:var(--accent); text-decoration:none;}
  a:hover{text-decoration:underline;}
  h1,h2,h3{font-family:var(--display); font-weight:600; margin:0; letter-spacing:-0.01em;}
  p{margin:0;}
  ul{list-style:none; margin:0; padding:0;}
  button{font-family:inherit;}

  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 24px; position:relative; z-index:1;}
  .eyebrow{
    font-family:var(--mono); font-size:0.72rem; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--accent); display:flex; align-items:center; gap:8px;
  }
  .eyebrow::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent);}

  /* ===== NAV ===== */
  #topnav{
    position:sticky; top:0; z-index:50;
    background:rgba(10,12,16,0.75); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  #topnav .wrap{display:flex; align-items:center; justify-content:space-between; padding:16px 24px; gap:16px;}
  .nav-logo{font-family:var(--mono); font-size:0.9rem; color:var(--text); white-space:nowrap;}
  .nav-logo span{color:var(--accent);}
  .nav-links{display:flex; gap:22px; flex-wrap:wrap;}
  .nav-links a{
    font-family:var(--mono); font-size:0.78rem; color:var(--text-dim);
    text-transform:lowercase; letter-spacing:0.02em;
  }
  .nav-links a:hover{color:var(--accent); text-decoration:none;}
  .nav-resume{
    font-family:var(--mono); font-size:0.75rem; color:var(--accent);
    border:1px solid var(--accent); border-radius:6px; padding:7px 14px;
    white-space:nowrap;
  }
  .nav-resume:hover{background:var(--accent-dim); text-decoration:none;}
  @media (max-width:760px){ .nav-links{display:none;} }

  /* ===== HERO ===== */
  header{padding:76px 0 60px; position:relative; z-index:1;}
  .hero-grid{display:grid; grid-template-columns:1.15fr 0.85fr; gap:48px; align-items:center;}
  @media (max-width:860px){ .hero-grid{grid-template-columns:1fr;} }

  /* Profile photo — enlarged, ringed, badge */
  .hero-photo-ring{ position:relative; width:104px; height:104px; }
  .hero-photo-ring::before{
    content:""; position:absolute; inset:-4px; border-radius:50%;
    background:conic-gradient(from 0deg, var(--accent), var(--circuit), var(--accent));
    animation:ringSpin 7s linear infinite;
  }
  .hero-photo-ring img{
    position:relative; z-index:1; width:100%; height:100%; border-radius:50%;
    object-fit:cover; display:block; border:3px solid var(--bg); background:var(--bg-elevated);
  }
  .hero-photo-badge{
    position:absolute; z-index:2; bottom:1px; right:1px; width:20px; height:20px; border-radius:50%;
    background:var(--accent); border:3px solid var(--bg); box-shadow:0 0 8px var(--accent);
  }
  @keyframes ringSpin{ to{ transform:rotate(360deg); } }

  .hero-name{font-size:clamp(2.1rem, 5vw, 3.1rem); margin-top:16px; line-height:1.08;}
  .hero-role{font-family:var(--body); color:var(--text-dim); font-size:1.05rem; margin-top:14px;}
  .hero-role strong{color:var(--text); font-weight:600;}
  .hero-actions{display:flex; align-items:center; gap:18px; margin-top:28px; flex-wrap:wrap;}
  .btn-primary{
    font-family:var(--mono); font-size:0.85rem; font-weight:500;
    background:var(--accent); color:var(--accent-ink); border:none; border-radius:8px;
    padding:12px 20px; display:inline-flex; align-items:center; gap:8px;
  }
  .btn-primary:hover{filter:brightness(1.08); text-decoration:none;}
  .social-row{display:flex; gap:16px;}
  .social-row a{
    width:38px; height:38px; border:1px solid var(--border); border-radius:8px;
    display:flex; align-items:center; justify-content:center; color:var(--text-dim); font-size:1.05rem;
  }
  .social-row a:hover{color:var(--accent); border-color:var(--accent); text-decoration:none;}

  /* Signature panel — the "core.signature" node map */
  .signature-panel{
    background:var(--bg-elevated); border:1px solid var(--border); border-radius:12px;
    overflow:hidden; box-shadow:0 30px 60px -30px rgba(0,0,0,0.6);
  }
  .signature-bar{
    display:flex; align-items:center; gap:8px; padding:11px 14px; border-bottom:1px solid var(--border);
    background:rgba(255,255,255,0.02);
  }
  .signature-dot{width:10px; height:10px; border-radius:50%; background:#3a3f4b;}
  .signature-title{
    font-family:var(--mono); font-size:0.72rem; color:var(--text-faint); margin-left:6px;
  }
  .signature-body{padding:6px 6px 4px;}
  .signature-body svg{width:100%; height:auto; display:block;}
  .sig-node-label{
    font-family:var(--mono); font-size:8.5px; fill:var(--text-dim);
  }
  .sig-core-label{
    font-family:var(--mono); font-size:9.5px; fill:var(--accent-ink); font-weight:600;
  }
  .sig-caption{
    font-family:var(--mono); font-size:0.68rem; color:var(--text-faint);
    padding:2px 16px 14px; text-align:center;
  }
  .sig-sweep{
    animation:sigSweepSpin 6s linear infinite;
  }
  @keyframes sigSweepSpin{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(-360deg); }
  }

  /* ===== SECTIONS ===== */
  section{padding:56px 0; border-top:1px solid var(--border-soft); position:relative; z-index:1;}
  section:first-of-type{border-top:none;}
  .section-head{display:flex; align-items:baseline; gap:14px; margin-bottom:28px;}
  .section-head h2{font-size:1.5rem;}
  .section-head .idx{font-family:var(--mono); font-size:0.78rem; color:var(--text-faint);}

  .reveal{opacity:0; transform:translateY(16px); transition:opacity 0.6s ease, transform 0.6s ease;}
  .reveal.in{opacity:1; transform:translateY(0);}

  /* About — content + a slim row of stat pills underneath */
  .about-layout{display:flex; flex-direction:column; gap:18px;}
  #about p{max-width:68ch; color:var(--text-dim); font-size:1.02rem;}
  .about-stats{display:flex; flex-wrap:wrap; gap:10px;}
  .about-stat{
    display:flex; align-items:baseline; gap:7px;
    border:1px solid var(--border-soft); border-radius:20px; padding:7px 14px;
    background:var(--bg-elevated);
  }
  .about-stat .num{font-family:var(--display); font-size:0.92rem; font-weight:700; color:var(--accent); line-height:1;}
  .about-stat .lbl{font-family:var(--mono); font-size:0.66rem; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.04em;}

  /* Education */
  .edu-list{display:flex; flex-direction:column; gap:0;}
  .edu-item{
    display:grid; grid-template-columns:34px 120px 1fr auto; gap:16px; align-items:baseline;
    padding:16px 0; border-bottom:1px solid var(--border-soft);
  }
  .edu-item:last-child{border-bottom:none;}
  .edu-icon{font-size:1.1rem; align-self:center;}
  .edu-item .edu-duration{font-family:var(--mono); font-size:0.78rem; color:var(--text-faint);}
  .edu-item h3{font-size:1rem; font-weight:600;}
  .edu-item .edu-inst{color:var(--text-dim); font-size:0.92rem; margin-top:2px;}
  .edu-status{
    font-family:var(--mono); font-size:0.68rem; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--text-faint); white-space:nowrap;
  }
  @media (max-width:600px){ .edu-item{grid-template-columns:24px 1fr; gap:4px;} .edu-status{grid-column:2;} }

  /* ===================================================================
     Experience — pipeline. UNCHANGED from the original design on purpose.
     =================================================================== */
  .pipeline{position:relative; padding-left:28px;}
  .pipeline::before{
    content:""; position:absolute; left:5px; top:6px; bottom:6px; width:1px; background:var(--border);
  }
  .pipe-node{position:relative; padding-bottom:34px;}
  .pipe-node:last-child{padding-bottom:0;}
  .pipe-dot{
    position:absolute; left:-28px; top:4px; width:11px; height:11px; border-radius:50%;
    background:var(--bg); border:2px solid var(--text-faint);
  }
  .pipe-node.is-current .pipe-dot{border-color:var(--amber); box-shadow:0 0 0 4px var(--amber-dim);}
  .pipe-node.is-done .pipe-dot{border-color:var(--accent); background:var(--accent);}

  .pipe-top{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;}
  .pipe-role h3{font-size:1.05rem;}
  .pipe-role .pipe-company{font-family:var(--mono); font-size:0.82rem; color:var(--text-dim); margin-top:3px;}
  .pipe-meta{display:flex; align-items:center; gap:12px;}
  .pipe-duration{font-family:var(--mono); font-size:0.75rem; color:var(--text-faint);}
  .status-badge{
    font-family:var(--mono); font-size:0.68rem; text-transform:uppercase; letter-spacing:0.06em;
    padding:4px 9px; border-radius:20px; display:inline-flex; align-items:center; gap:6px;
  }
  .status-badge.running{color:var(--amber); background:var(--amber-dim);}
  .status-badge.running::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--amber); animation:pulse 1.4s ease-in-out infinite;}
  .status-badge.passed{color:var(--accent); background:var(--accent-dim);}
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }

  .pipe-summary{color:var(--text-dim); font-size:0.94rem; margin-top:10px; max-width:64ch;}
  .pipe-toggle{
    font-family:var(--mono); font-size:0.75rem; color:var(--text-faint);
    background:none; border:none; padding:8px 0 0; cursor:pointer;
  }
  .pipe-toggle:hover{color:var(--accent);}
  .pipe-details{display:none; margin-top:10px;}
  .pipe-details ul{display:flex; flex-direction:column; gap:7px;}
  .pipe-details li{
    color:var(--text-dim); font-size:0.9rem; padding-left:16px; position:relative;
  }
  .pipe-details li::before{content:"›"; position:absolute; left:0; color:var(--accent);}
  /* ===================== end untouched experience block ===================== */

  /* Projects — upgraded */
  .proj-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  @media (max-width:760px){ .proj-grid{grid-template-columns:1fr;} }

  .proj-card{
    position:relative; border:1px solid var(--border); border-radius:14px;
    background:var(--bg-elevated); display:flex; flex-direction:column;
    overflow:hidden;
    transition:border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
  }
  .proj-card:hover{
    border-color:rgba(57,255,136,0.4); transform:translateY(-4px);
    box-shadow:0 20px 40px -24px rgba(57,255,136,0.35);
  }
  .proj-card.featured{grid-column:1 / -1;}
  .proj-card.featured .proj-art{height:108px;}
  .proj-card.featured .proj-body{padding:26px 28px 24px;}
  .proj-card.featured h3{font-size:1.2rem;}

  .proj-art{
    position:relative; height:78px; overflow:hidden;
    background:
      radial-gradient(120% 160% at 0% 0%, var(--accent-dim), transparent 60%),
      radial-gradient(120% 160% at 100% 100%, var(--circuit-dim), transparent 60%),
      var(--bg);
    border-bottom:1px solid var(--border-soft);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 18px;
  }
  .proj-art .proj-index{
    font-family:var(--display); font-weight:700; font-size:2.6rem;
    color:transparent; -webkit-text-stroke:1px rgba(220,225,232,0.16);
    line-height:1;
  }
  .proj-art .proj-status{
    font-family:var(--mono); font-size:0.65rem; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--accent); background:var(--accent-dim); border:1px solid rgba(57,255,136,0.25);
    padding:4px 9px; border-radius:20px; white-space:nowrap;
  }

  .proj-body{display:flex; flex-direction:column; gap:12px; padding:18px 20px 20px;}
  .proj-head{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .proj-card h3{font-size:1.02rem; display:flex; align-items:center; gap:8px;}
  .proj-card h3 i.proj-title-icon{color:var(--accent); font-size:0.85em;}
  .proj-link{
    font-family:var(--mono); font-size:0.72rem; color:var(--text-dim); border:1px solid var(--border);
    border-radius:6px; padding:5px 9px; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .proj-link:hover{color:var(--accent); border-color:var(--accent); text-decoration:none;}
  .proj-card p.proj-summary{color:var(--text-dim); font-size:0.9rem;}
  .proj-tags{display:flex; flex-wrap:wrap; gap:6px;}
  .tag{
    font-family:var(--mono); font-size:0.68rem; color:var(--text-dim);
    background:rgba(255,255,255,0.04); border:1px solid var(--border-soft);
    padding:3px 8px; border-radius:5px;
  }
  .proj-toggle{
    font-family:var(--mono); font-size:0.74rem; color:var(--text-faint);
    background:none; border:none; padding:0; text-align:left; cursor:pointer; margin-top:2px;
    display:flex; align-items:center; gap:6px;
  }
  .proj-toggle:hover{color:var(--accent);}
  .proj-toggle i{transition:transform 0.25s ease; font-size:0.65rem;}
  .proj-toggle.is-open i{transform:rotate(180deg);}
  .proj-details{
    max-height:0; opacity:0; overflow:hidden;
    transition:max-height 0.35s ease, opacity 0.3s ease, margin-top 0.35s ease;
  }
  .proj-details.is-open{opacity:1; margin-top:2px;}
  .proj-details ul{display:flex; flex-direction:column; gap:6px; padding-bottom:2px;}
  .proj-details li{color:var(--text-dim); font-size:0.85rem; padding-left:14px; position:relative;}
  .proj-details li::before{content:"›"; position:absolute; left:0; color:var(--accent);}

  /* Projects — compact line list, click a row to expand */
  .proj-list{
    display:flex; flex-direction:column;
    border:1px solid var(--border); border-radius:12px; overflow:hidden;
    background:var(--bg-elevated);
  }
  .proj-row{border-bottom:1px solid var(--border-soft);}
  .proj-row:last-child{border-bottom:none;}
  .proj-row-head{
    display:flex; align-items:center; gap:14px; padding:15px 18px; cursor:pointer;
    transition:background 0.2s ease; background:none; border:none; width:100%; text-align:left; color:inherit;
  }
  .proj-row-head:hover{background:rgba(255,255,255,0.03);}
  .proj-row-index{font-family:var(--mono); font-size:0.74rem; color:var(--text-faint); width:22px; flex:none;}
  .proj-row-icon{color:var(--accent); font-size:0.92rem; width:18px; text-align:center; flex:none;}
  .proj-row-title{font-family:var(--display); font-size:0.96rem; font-weight:600; flex:1; min-width:0;}
  .proj-row-hint{
    font-family:var(--mono); font-size:0.68rem; color:var(--text-faint); white-space:nowrap; display:none;
  }
  @media (min-width:640px){ .proj-row-hint{display:inline;} }
  .proj-row-chevron{color:var(--text-faint); font-size:0.72rem; transition:transform 0.25s ease; flex:none;}
  .proj-row.is-open .proj-row-chevron{transform:rotate(180deg); color:var(--accent);}
  .proj-row.is-open .proj-row-title{color:var(--accent);}

  .proj-row-body{max-height:0; opacity:0; overflow:hidden; transition:max-height 0.35s ease, opacity 0.3s ease;}
  .proj-row-body.is-open{opacity:1;}
  .proj-row-body-inner{padding:0 18px 18px 54px;}
  .proj-row-body p.proj-row-summary{color:var(--text-dim); font-size:0.9rem; margin-bottom:10px;}
  .proj-row-tags{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;}
  .proj-row-body ul{display:flex; flex-direction:column; gap:6px; margin-bottom:12px;}
  .proj-row-body li{color:var(--text-dim); font-size:0.85rem; padding-left:14px; position:relative;}
  .proj-row-body li::before{content:"›"; position:absolute; left:0; color:var(--accent);}
  .proj-row-link{
    font-family:var(--mono); font-size:0.72rem; color:var(--text-dim); border:1px solid var(--border);
    border-radius:6px; padding:5px 9px; display:inline-flex; align-items:center; gap:6px;
  }
  .proj-row-link:hover{color:var(--accent); border-color:var(--accent); text-decoration:none;}

  /* Achievements */
  .ach-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:760px){ .ach-grid{grid-template-columns:1fr;} }
  .ach-card{
    border:1px solid var(--border-soft); border-radius:12px; padding:18px;
    transition:border-color 0.2s ease, transform 0.2s ease;
  }
  .ach-card:hover{border-color:rgba(57,255,136,0.3); transform:translateY(-2px);}
  .ach-card h3{font-size:0.92rem; display:flex; align-items:center; gap:10px;}
  .ach-card h3 .ach-icon{
    width:26px; height:26px; border-radius:7px; background:var(--accent-dim);
    display:flex; align-items:center; justify-content:center; color:var(--accent); font-size:0.78em; flex:none;
  }
  .ach-card p.ach-summary{color:var(--text-dim); font-size:0.85rem; margin-top:8px;}
  .ach-toggle{font-family:var(--mono); font-size:0.7rem; color:var(--text-faint); background:none; border:none; padding:8px 0 0; cursor:pointer;}
  .ach-toggle:hover{color:var(--accent);}
  .ach-details{max-height:0; opacity:0; overflow:hidden; transition:max-height 0.35s ease, opacity 0.3s ease;}
  .ach-details.is-open{opacity:1;}
  .ach-details p{color:var(--text-dim); font-size:0.82rem; margin-top:4px;}
  .ach-details strong{color:var(--text);}

  /* Skills */
  .skill-groups{display:flex; flex-direction:column; gap:20px;}
  .skill-group-label{font-family:var(--mono); font-size:0.72rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-faint); margin-bottom:10px;}
  .chip-row{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    font-family:var(--mono); font-size:0.8rem; color:var(--text);
    border:1px solid var(--border); border-radius:7px; padding:7px 12px;
    background:var(--bg-elevated); transition:border-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
    display:inline-flex; align-items:center; gap:7px;
  }
  .chip:hover{border-color:var(--accent); color:var(--accent); transform:translateY(-2px);}

  /* Contact */
  .contact-grid{display:grid; grid-template-columns:0.85fr 1.15fr; gap:36px;}
  @media (max-width:760px){ .contact-grid{grid-template-columns:1fr;} }
  .contact-info-list{display:flex; flex-direction:column; gap:16px;}
  .contact-info-row{display:flex; align-items:center; gap:12px;}
  .contact-info-row i{color:var(--accent); width:18px; text-align:center;}
  .contact-info-row a, .contact-info-row span{color:var(--text-dim); font-size:0.94rem;}
  .contact-info-row a:hover{color:var(--accent);}

  .contact-panel{border:1px solid var(--border); border-radius:12px; padding:26px; background:var(--bg-elevated);}
  .contact-form{display:flex; flex-direction:column;}
  .contact-form label{
    font-family:var(--mono); font-size:0.7rem; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--text-faint); margin:14px 0 6px;
  }
  .contact-form label:first-of-type{margin-top:0;}
  .contact-form input, .contact-form textarea{
    background:var(--bg); border:1px solid var(--border); border-radius:8px;
    padding:11px 13px; color:var(--text); font-family:var(--body); font-size:0.94rem; resize:vertical;
  }
  .contact-form input:focus, .contact-form textarea:focus{outline:none; border-color:var(--accent);}
  .contact-form button[type=submit]{

<body>

<script>
  // -----------------------------------------------------------------
  // All content lives in data/data.json — this script just renders it.
  // -----------------------------------------------------------------

  function esc(str){
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }
  function slug(str){
    return String(str).toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
  }

  /* Experience toggle — kept exactly as the original implementation. */
  function toggleDetails(id){
    const el = document.getElementById(id);
    if(!el) return;
    el.style.display = (el.style.display === 'block') ? 'none' : 'block';
  }
  window.toggleDetails = toggleDetails;

  /* Smooth accordion toggle used by the upgraded Projects / Achievements cards. */
  function toggleSmooth(id, btn){
    const el = document.getElementById(id);
    if(!el) return;
    const isOpen = el.classList.contains('is-open');
    if(isOpen){
      el.style.maxHeight = el.scrollHeight + 'px';
      requestAnimationFrame(() => {
        el.style.maxHeight = '0px';
        el.classList.remove('is-open');
      });
      if(btn) btn.classList.remove('is-open');
    }else{
      el.classList.add('is-open');
      el.style.maxHeight = el.scrollHeight + 'px';
      el.addEventListener('transitionend', function handler(){
        if(el.classList.contains('is-open')) el.style.maxHeight = 'none';
        el.removeEventListener('transitionend', handler);
      });
      if(btn) btn.classList.add('is-open');
    }
  }
  window.toggleSmooth = toggleSmooth;

  /* Project row expand/collapse — rotates the chevron and unrolls the body. */
  function toggleProjectRow(id){
    const row = document.getElementById('row-' + id);
    const body = document.getElementById(id);
    const head = row ? row.querySelector('.proj-row-head') : null;
    if(!row || !body) return;
    const isOpen = row.classList.contains('is-open');
    if(isOpen){
      body.style.maxHeight = body.scrollHeight + 'px';
      requestAnimationFrame(() => {
        body.style.maxHeight = '0px';
        body.classList.remove('is-open');
        row.classList.remove('is-open');
      });
      if(head) head.setAttribute('aria-expanded', 'false');
    }else{
      body.classList.add('is-open');
      row.classList.add('is-open');
      body.style.maxHeight = body.scrollHeight + 'px';
      body.addEventListener('transitionend', function handler(){
        if(body.classList.contains('is-open')) body.style.maxHeight = 'none';
        body.removeEventListener('transitionend', handler);
      });
      if(head) head.setAttribute('aria-expanded', 'true');
    }
  }
  window.toggleProjectRow = toggleProjectRow;

  /* ---------- Neural network background ---------- */
  function initNeuralBackground(){
    const canvas = document.getElementById('neural-bg');
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const accent = '57,255,136';
    const circuit = '59,130,246';

    let w, h, dpr, particles = [];

    function sizeCanvas(){
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = document.documentElement.scrollHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function seedParticles(){
      const density = Math.min(120, Math.floor((w * h) / 16000));
      particles = [];
      for(let i = 0; i < density; i++){
        particles.push({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.18,
          vy: (Math.random() - 0.5) * 0.18,
          r: Math.random() * 1.4 + 0.9,
          isNode: Math.random() < 0.22
        });
      }
    }

    const LINK_DIST = 150;

    function step(){
      ctx.clearRect(0, 0, w, h);

      for(const p of particles){
        p.x += p.vx;
        p.y += p.vy;
        if(p.x < -20) p.x = w + 20; if(p.x > w + 20) p.x = -20;
        if(p.y < -20) p.y = h + 20; if(p.y > h + 20) p.y = -20;
      }

      for(let i = 0; i < particles.length; i++){
        for(let j = i + 1; j < particles.length; j++){
          const a = particles[i], b = particles[j];
          const dx = a.x - b.x, dy = a.y - b.y;
          const dist = Math.sqrt(dx*dx + dy*dy);
          if(dist < LINK_DIST){
            const alpha = (1 - dist / LINK_DIST) * 0.22;
            ctx.strokeStyle = `rgba(${circuit},${alpha})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
      }

      for(const p of particles){
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.isNode ? `rgba(${accent},0.75)` : `rgba(${circuit},0.55)`;
        if(p.isNode){
          ctx.shadowColor = `rgba(${accent},0.9)`;
          ctx.shadowBlur = 6;
        }else{
          ctx.shadowBlur = 0;
        }
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      if(!reduceMotion) requestAnimationFrame(step);
    }

    sizeCanvas();
    seedParticles();
    step();

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { sizeCanvas(); seedParticles(); if(reduceMotion) step(); }, 200);
    });

    setTimeout(() => { sizeCanvas(); seedParticles(); if(reduceMotion) step(); }, 800);
  }

  /* ---------- Header / Hero ---------- */
  function renderHeader(profile, skills){
    const header = document.getElementById('header-content');
    document.getElementById('nav-logo').innerHTML = initials(profile.name) + '<span>.</span>';
    document.getElementById('nav-resume-link').setAttribute('href', profile.resumeFile);

    const seen = new Set();
    const flatSkills = (skills || [])
      .flatMap(g => g.items)
      .filter(s => {
        const key = (s.text || '').trim().toLowerCase();
        if(!key || key === 'selenium' || seen.has(key)) return false;
        seen.add(key);
        return true;
      })
      .slice(0, 6);

    header.innerHTML = `
      <div class="wrap hero-grid">
        <div>
          <div class="hero-photo-ring">
            <img src="${esc(profile.photo)}" alt="${esc(profile.name)}" />
            <span class="hero-photo-badge" title="Available for opportunities"></span>
          </div>
          <div class="eyebrow" style="margin-top:16px;">available for opportunities</div>
          <h1 class="hero-name">${esc(profile.name)}</h1>
          <p class="hero-role"><strong>${esc(profile.title)}</strong> — ${esc(profile.company)}</p>
          <div class="hero-actions">
            <a href="${esc(profile.resumeFile)}" download class="btn-primary">
              <i class="fa-solid fa-arrow-down"></i> Download resume
            </a>
            <div class="social-row">
              <a href="mailto:${esc(profile.email)}" aria-label="Email"><i class="fa-solid fa-envelope"></i></a>
              <a href="${esc(profile.linkedin)}" target="_blank" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
              <a href="tel:${esc(profile.phone)}" aria-label="Phone"><i class="fa-solid fa-phone"></i></a>
            </div>
          </div>
        </div>
        <div class="signature-panel">
          <div class="signature-bar">
            <div class="signature-dot"></div><div class="signature-dot"></div><div class="signature-dot"></div>
            <span class="signature-title">core.signature</span>
          </div>
          <div class="signature-body" id="sig-body"></div>
          <div class="sig-caption">// live map of core focus areas</div>
        </div>
      </div>
    `;

    renderSignaturePanel(profile, flatSkills);
  }

  function initials(name){
    return (name || '').split(' ').filter(Boolean).slice(0,2).map(w => w[0]).join('').toLowerCase();
  }

  function shortSkillLabel(text){
    // Trim parenthetical detail so labels never run off the card edge,
    // e.g. "SQL (Database Management)" -> "SQL".
    const stripped = String(text || '').replace(/\s*\([^)]*\)\s*/g, '').trim();
    const base = stripped || text || '';
    return base.length > 14 ? base.slice(0, 13) + '…' : base;
  }

  function renderSignaturePanel(profile, flatSkills){
    const mount = document.getElementById('sig-body');
    if(!mount) return;

    const W = 320, H = 240, cx = W / 2, cy = H / 2 + 4, R = 78;
    const n = Math.max(flatSkills.length, 1);

    let lines = '';
    let nodes = '';
    let labels = '';

    flatSkills.forEach((s, i) => {
      const angle = (Math.PI * 2 * i) / n - Math.PI / 2;
      const nx = cx + R * Math.cos(angle);
      const ny = cy + R * Math.sin(angle);
      const dur = (3 + (i % 4) * 0.6).toFixed(1);

      lines += `<line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="var(--circuit)" stroke-opacity="0.35" stroke-width="1">
        <animate attributeName="stroke-opacity" values="0.15;0.5;0.15" dur="${dur}s" repeatCount="indefinite" />
      </line>`;

      nodes += `<circle cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" r="4" fill="var(--circuit)">
        <animate attributeName="r" values="3.2;5;3.2" dur="${dur}s" repeatCount="indefinite" />
      </circle>`;

      const anchor = Math.cos(angle) > 0.35 ? 'start' : (Math.cos(angle) < -0.35 ? 'end' : 'middle');
      const lx = cx + (R + 16) * Math.cos(angle);
      const ly = cy + (R + 16) * Math.sin(angle) + 3;
      labels += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anchor}" class="sig-node-label">${esc(shortSkillLabel(s.text))}</text>`;
    });

    // A slowly rotating radar sweep — driven by CSS (same technique as the
    // hero photo ring), drawn on top and offset from the fixed spokes so it's
    // always visible as it rotates anticlockwise.
    const sweep = `
      <g class="sig-sweep" style="transform-box:view-box; transform-origin:${cx}px ${cy}px;">
        <line x1="${cx}" y1="${cy}" x2="${cx}" y2="${(cy - R - 6).toFixed(1)}"
              stroke="url(#sweepGradient)" stroke-width="2.5" stroke-linecap="round" />
        <circle cx="${cx}" cy="${(cy - R - 6).toFixed(1)}" r="3" fill="var(--accent)" />
      </g>

  /* ---------- Experience duration helpers (used by About stats + chatbot) ---------- */
  const MONTHS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  function parseMonthYear(str){
    if(!str) return null;
    if(/present/i.test(str)) return new Date();
    const m = str.match(/([A-Za-z]+)\.?\s+(\d{4})/);
    if(!m) return null;
    const monIdx = MONTHS.findIndex(mo => m[1].toLowerCase().startsWith(mo));
    if(monIdx === -1) return null;
    return new Date(parseInt(m[2], 10), monIdx, 1);
  }
  function monthsBetween(start, end){
    let months = (end.getFullYear() - start.getFullYear()) * 12 + (end.getMonth() - start.getMonth());
    return Math.max(months, 0);
  }
  function formatMonths(months){
    const years = Math.floor(months / 12);
    const rem = months % 12;
    if(years > 0 && rem > 0) return `${years} yr ${rem} mo`;
    if(years > 0) return `${years} yr`;
    return `${months} mo`;
  }
  function computeExperienceSpan(experience){
    if(!experience || !experience.length) return null;
    let earliest = null;
    experience.forEach(e => {
      const parts = String(e.duration || '').split(/[–—-]/).map(s => s.trim());
      const start = parseMonthYear(parts[0]);
      if(start && (!earliest || start < earliest)) earliest = start;
    });
    if(!earliest) return null;
    const months = monthsBetween(earliest, new Date());
    return { months, label: formatMonths(months) };
  }
  function computeCurrentRoleDuration(experience){
    if(!experience || !experience.length) return null;
    const current = experience.find(e => e.current) || experience[0];
    const parts = String(current.duration || '').split(/[–—-]/).map(s => s.trim());
    const start = parseMonthYear(parts[0]);
    if(!start) return null;
    const months = monthsBetween(start, new Date());
    return { months, label: formatMonths(months), role: current.role, company: current.company };
  }
  function isInternship(exp){
    return /intern/i.test(exp.role || '') || /intern/i.test(exp.company || '');
  }
  // Professional (non-internship) span: earliest full-time role to now.
  function computeProfessionalSpan(experience){
    if(!experience || !experience.length) return null;
    let earliest = null;
    experience.forEach(e => {
      if(isInternship(e)) return;
      const parts = String(e.duration || '').split(/[–—-]/).map(s => s.trim());
      const start = parseMonthYear(parts[0]);
      if(start && (!earliest || start < earliest)) earliest = start;
    });
    if(!earliest) return null;
    const months = monthsBetween(earliest, new Date());
    return { months, label: formatMonths(months) };
  }
  // Internship time: sum of duration across any entries flagged as internships.
  function computeInternshipMonths(experience){
    if(!experience || !experience.length) return null;
    let total = 0, found = false;
    experience.forEach(e => {
      if(!isInternship(e)) return;
      found = true;
      const parts = String(e.duration || '').split(/[–—-]/).map(s => s.trim());
      const start = parseMonthYear(parts[0]);
      const end = parts[1] && /present/i.test(parts[1]) ? new Date() : parseMonthYear(parts[1]);
      if(start && end) total += Math.max(monthsBetween(start, end), 1);
    });
    if(!found) return null;
    return { months: total, label: formatMonths(total) };
  }

  function levenshtein(a, b){
    const m = a.length, n = b.length;
    if(!m) return n; if(!n) return m;
    const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
    for(let i = 0; i <= m; i++) dp[i][0] = i;
    for(let j = 0; j <= n; j++) dp[0][j] = j;
    for(let i = 1; i <= m; i++){
      for(let j = 1; j <= n; j++){
        dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j - 1], dp[i - 1][j], dp[i][j - 1]);
      }
    }
    return dp[m][n];
  }

  function matchChatIntent(input, rules){
    const lower = input.toLowerCase();
    const words = lower.split(/[^a-z0-9]+/).filter(Boolean);

    // 1) exact substring match — fastest path
    for(const rule of rules){
      if(rule.keywords.some(kw => lower.includes(kw.toLowerCase()))) return rule.type;
    }

    // 2) typo-tolerant fallback — catches "experiance", "salery", etc.
    for(const rule of rules){
      for(const kw of rule.keywords){
        const kwLower = kw.toLowerCase();
        if(kwLower.includes(' ')) continue; // fuzzy matching is per-word only
        if(kwLower.length < 4) continue;
        for(const w of words){
          if(w.length < 4) continue;
          const maxDist = kwLower.length > 7 ? 2 : 1;
          if(levenshtein(w, kwLower) <= maxDist) return rule.type;
        }
      }
    }
    return null;
  }

  function appendChatMessage(role, html){
    const list = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.className = 'chat-msg ' + role;
    div.innerHTML = html;
    list.appendChild(div);
    list.scrollTop = list.scrollHeight;
    return div;
  }

  function showChatTyping(){
    const list = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.className = 'chat-typing';
    div.innerHTML = '<span></span><span></span><span></span>';
    list.appendChild(div);
    list.scrollTop = list.scrollHeight;
    return div;
  }

  function wireChatbot(data){
    const chatbot = data.chatbot;
    if(!chatbot) return;

    const toggle = document.getElementById('chat-toggle');
    const panel = document.getElementById('chat-panel');
    const suggestionsEl = document.getElementById('chat-suggestions');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('chat-input');

    const allRules = [...(chatbot.rules || []), ...BUILT_IN_HR_RULES];

    const firstName = (data.profile.name || '').split(' ')[0] || 'there';
    const greetingVariants = [
      chatbot.greeting,
      `Hey! I can walk you through ${firstName}'s experience, projects, or skills — what would you like to know?`,
      `Hi there 👋 Ask me anything — experience, notice period, projects, you name it.`
    ].filter(Boolean);
    const greeting = greetingVariants[Math.floor(Math.random() * greetingVariants.length)];
    appendChatMessage('bot', esc(greeting));

    const allSuggestions = [...(chatbot.suggestions || []), 'How many years of experience?', "What's your notice period?"];
    suggestionsEl.innerHTML = allSuggestions.map(q =>
      `<button type="button" class="chat-chip">${esc(q)}</button>`
    ).join('');

    function handleQuestion(text){
      if(!text.trim()) return;
      appendChatMessage('user', esc(text));
      input.value = '';
      const typing = showChatTyping();
      setTimeout(() => {
        typing.remove();
        const type = matchChatIntent(text, allRules);
        const answer = type ? buildChatAnswer(type, data) : null;

        if(answer){
          appendChatMessage('bot', answer);
          return;
        }

        const fallbackHtml = `
          ${esc(chatbot.fallback)}
          <div class="chat-fallback-card">
            <p>I'll personally reply within about 5 minutes if you send it through the contact form.</p>
            <button type="button" class="chat-fallback-btn"><i class="fa-solid fa-paper-plane"></i> Ask directly</button>
          </div>
        `;
        const card = appendChatMessage('bot', fallbackHtml);
        const btn = card.querySelector('.chat-fallback-btn');
        if(btn){
          btn.addEventListener('click', () => {
            panel.classList.remove('open');
            toggle.classList.remove('open');
            const contactSection = document.getElementById('contact');
            if(contactSection) contactSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            setTimeout(() => {
              const msgField = document.getElementById('cf-message');
              if(msgField){
                if(!msgField.value) msgField.value = text;
                msgField.focus();
              }
            }, 500);
          });
        }
      }, 500);
    }

    suggestionsEl.addEventListener('click', (e) => {
      const btn = e.target.closest('.chat-chip');
      if(btn) handleQuestion(btn.textContent);
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      handleQuestion(input.value);
    });

    toggle.addEventListener('click', () => {
      const isOpen = panel.classList.toggle('open');
      toggle.classList.toggle('open', isOpen);
      if(isOpen) input.focus();
      hideHint();
    });

    const hint = document.getElementById('chat-hint');
    const hintClose = document.getElementById('chat-hint-close');
    function hideHint(){ if(hint) hint.classList.remove('show'); }

    if(hint){
      const hintTimer = setTimeout(() => hint.classList.add('show'), 2200);
      hintClose.addEventListener('click', (e) => { e.stopPropagation(); clearTimeout(hintTimer); hideHint(); });
      hint.addEventListener('click', () => {
        hideHint();
        panel.classList.add('open');
        toggle.classList.add('open');
        input.focus();
      });
    }
  }

  /* ---------- Footer ---------- */
  function renderFooter(profile){
    document.getElementById('footer-content').innerHTML = `
      <div class="wrap">
        <p>${esc(profile.name)} — © ${new Date().getFullYear()}</p>
        <p>built with python, playwright &amp; a bit of ci/cd</p>
      </div>
    `;
  }

  /* ---------- Scroll reveal ---------- */
  function setupReveal(){
    const els = document.querySelectorAll('.reveal');
    if(!('IntersectionObserver' in window)){
      els.forEach(el => el.classList.add('in'));
      return;
    }
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if(entry.isIntersecting){
          entry.target.classList.add('in');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12 });
    els.forEach(el => io.observe(el));
  }

  /* ---------- Orchestration ---------- */
  function renderPortfolio(data){
    renderHeader(data.profile, data.skills);

    const main = document.getElementById('main-content');
    main.innerHTML = [
      renderAbout(data),
      renderEducation(data.education),
      renderExperience(data.experience),
      renderProjects(data.projects),
      renderAchievements(data.achievements),
      renderSkills(data.skills),
      renderContact(data.profile, data.contactForm),
      renderFeedback(data.profile)
    ].join('');

    renderFooter(data.profile);
    wireContactForm(data.contactForm);
    wireFeedbackForm(data.profile, data.contactForm);
    wireChatbot(data);
    setupReveal();

    setTimeout(() => window.dispatchEvent(new Event('resize')), 100);
  }

  initNeuralBackground();

  fetch('data/data.json')
    .then(res => {
      if(!res.ok) throw new Error('Failed to load data/data.json (' + res.status + ')');
      return res.json();
    })
    .then(renderPortfolio)
    .catch(err => {
      document.getElementById('main-content').innerHTML =
        `<div class="load-note">Couldn't load data/data.json: ${esc(err.message)}.<br>Make sure there's a "data" folder next to this file containing data.json, and that you're viewing this via a local server (not file://).</div>`;
      console.error(err);
    });
</script>
